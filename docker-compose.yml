version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civicpulse-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - APP_MODE=demo
      - AWS_REGION=ap-south-1
      - FRONTEND_ORIGIN=http://localhost:5173
    volumes:
      - ./data:/app/data
      - ./backend/app:/app/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: civicpulse-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
