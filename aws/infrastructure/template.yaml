AWSTemplateFormatVersion: '2010-09-09'
Description: >
  CivicPulse — Madurai Spatial Lakehouse
  Complete Native AWS CloudFormation Infrastructure:
  Amazon S3, AWS Glue, Amazon Athena, Amazon Location Service (Maps, Places, Routes, Geofences), Lambda & EventBridge.

Parameters:
  Environment:
    Type: String
    Default: development
    AllowedValues: [development, staging, production]
    Description: Deployment target stage.

  LakehouseBucketPrefix:
    Type: String
    Default: civicpulse-lakehouse
    Description: S3 bucket prefix for Apache Iceberg warehouse, raw telemetry, and Athena results.

Resources:
  # 1. Primary S3 Lakehouse Bucket
  SpatialLakehouseBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${LakehouseBucketPrefix}-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  # 2. AWS Glue Catalog Database
  CivicPulseGlueDatabase:
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: civicpulse_db
        Description: "CivicPulse Madurai Spatial Lakehouse Apache Iceberg Database"
        LocationUri: !Sub "s3://${SpatialLakehouseBucket}/civicpulse/warehouse/"

  # 3. Amazon Athena Workgroup
  CivicPulseAthenaWorkgroup:
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: civicpulse-workgroup
      Description: "Athena Workgroup for CivicPulse Iceberg Queries & MERGE mutations"
      State: ENABLED
      WorkGroupConfiguration:
        EnforceWorkGroupConfiguration: true
        PublishCloudWatchMetricsEnabled: true
        ResultConfiguration:
          OutputLocation: !Sub "s3://${SpatialLakehouseBucket}/civicpulse/query-results/"
          EncryptionConfiguration:
            EncryptionOption: SSE_S3

  # 4. Amazon Location Service Map
  CivicPulseLocationMap:
    Type: AWS::Location::Map
    Properties:
      MapName: CivicPulseMaduraiMap
      Description: "Dark cartographic base map for Madurai spatial decision center"
      Configuration:
        Style: VectorEsriDarkGrayCanvas

  # 5. Amazon Location Service Place Index
  CivicPulsePlaceIndex:
    Type: AWS::Location::PlaceIndex
    Properties:
      IndexName: CivicPulseMaduraiPlaces
      Description: "Madurai Places Search Index with Esri provider"
      DataSource: Esri
      DataSourceConfiguration:
        IntendedUse: SingleUse

  # 6. Amazon Location Service Route Calculator
  CivicPulseRouteCalculator:
    Type: AWS::Location::RouteCalculator
    Properties:
      CalculatorName: CivicPulseMaduraiRoutes
      Description: "Hazard-aware route calculator for Madurai urban corridors"
      DataSource: Esri

  # 7. Amazon Location Service Geofence Collection
  CivicPulseGeofenceCollection:
    Type: AWS::Location::GeofenceCollection
    Properties:
      CollectionName: CivicPulseMaduraiGeofences
      Description: "Geofence collection representing active Madurai flood and hazard zones"

  # 8. Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "CivicPulse-LambdaExecutionRole-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CivicPulseLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${SpatialLakehouseBucket}"
                  - !Sub "arn:aws:s3:::${SpatialLakehouseBucket}/*"
              - Effect: Allow
                Action:
                  - athena:StartQueryExecution
                  - athena:GetQueryExecution
                  - athena:GetQueryResults
                Resource: "*"
              - Effect: Allow
                Action:
                  - glue:GetDatabase
                  - glue:GetTable
                  - glue:GetPartitions
                Resource: "*"

  # 9. Lambda Function for Geofence Event Handling (Inline)
  GeofenceEventHandlerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: CivicPulse-GeofenceEventHandler
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          ATHENA_DATABASE: civicpulse_db
          ATHENA_RESULTS_S3_URI: !Sub "s3://${SpatialLakehouseBucket}/civicpulse/query-results/"
      Code:
        ZipFile: |
          import json
          import logging
          import os

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def handler(event, context):
              logger.info("Received Geofence Event from EventBridge: %s", json.dumps(event))
              detail = event.get("detail", {})
              event_type = detail.get("EventType")
              geofence_id = detail.get("GeofenceId")
              device_id = detail.get("DeviceId")
              sample_time = detail.get("SampleTime")
              position = detail.get("Position", [])
              logger.info("Device %s -> %s on %s at %s", device_id, event_type, geofence_id, sample_time)
              return {
                  "statusCode": 200,
                  "body": json.dumps({"event_type": event_type, "geofence_id": geofence_id})
              }

  # 10. EventBridge Rule for Geofence Events
  GeofenceEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: CivicPulse-GeofenceBreachRule
      Description: "Routes Amazon Location Geofence breach events to Lambda handler"
      EventPattern:
        source:
          - aws.geo
        detail-type:
          - Location Geofence Event
        detail:
          EventType:
            - ENTER
            - EXIT
      Targets:
        - Arn: !GetAtt GeofenceEventHandlerFunction.Arn
          Id: TargetGeofenceLambda

  # Permission for EventBridge to invoke Lambda
  PermissionForEventsToInvokeLambda:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GeofenceEventHandlerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt GeofenceEventRule.Arn

Outputs:
  LakehouseBucket:
    Description: S3 Bucket hosting the Apache Iceberg Lakehouse
    Value: !Ref SpatialLakehouseBucket

  GlueDatabase:
    Description: AWS Glue Database Name
    Value: !Ref CivicPulseGlueDatabase

  AthenaWorkgroup:
    Description: Athena Workgroup
    Value: !Ref CivicPulseAthenaWorkgroup

  LocationMapName:
    Description: Amazon Location Map Name
    Value: !Ref CivicPulseLocationMap

  LocationPlaceIndex:
    Description: Amazon Location Place Index Name
    Value: !Ref CivicPulsePlaceIndex

  LocationRouteCalculator:
    Description: Amazon Location Route Calculator Name
    Value: !Ref CivicPulseRouteCalculator

  LocationGeofenceCollection:
    Description: Amazon Location Geofence Collection Name
    Value: !Ref CivicPulseGeofenceCollection
